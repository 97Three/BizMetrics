name: ${BIZMETRICS_COMPOSE_PROJECT_NAME:-bizmetrics-prod}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${BIZMETRICS_LOG_MAX_SIZE:-20m}
    max-file: ${BIZMETRICS_LOG_MAX_FILES:-5}

services:
  caddy:
    image: caddy:${BIZMETRICS_CADDY_VERSION:-2.11.4-alpine}
    restart: unless-stopped
    init: true
    stop_grace_period: ${BIZMETRICS_CADDY_STOP_GRACE_PERIOD:-20s}
    cpus: "${BIZMETRICS_CADDY_CPUS:-0.50}"
    mem_limit: ${BIZMETRICS_CADDY_MEMORY_LIMIT:-256m}
    pids_limit: ${BIZMETRICS_CADDY_PIDS_LIMIT:-128}
    logging: *default-logging
    environment:
      BIZMETRICS_PUBLIC_HOST: ${BIZMETRICS_PUBLIC_HOST:?BIZMETRICS_PUBLIC_HOST is required}
      BIZMETRICS_TLS_EMAIL: ${BIZMETRICS_TLS_EMAIL:?BIZMETRICS_TLS_EMAIL is required}
      BIZMETRICS_MINIO_BUCKET: ${BIZMETRICS_MINIO_BUCKET:-bizmetrics}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - bizmetrics-caddy-data:/data
      - bizmetrics-caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bizmetrics-backend:prod
    restart: unless-stopped
    init: true
    stop_grace_period: ${BIZMETRICS_BACKEND_STOP_GRACE_PERIOD:-45s}
    cpus: "${BIZMETRICS_BACKEND_CPUS:-2.0}"
    mem_limit: ${BIZMETRICS_BACKEND_MEMORY_LIMIT:-1536m}
    pids_limit: ${BIZMETRICS_BACKEND_PIDS_LIMIT:-256}
    logging: *default-logging
    environment:
      JAVA_TOOL_OPTIONS: "${BIZMETRICS_JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError}"
      BIZMETRICS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BIZMETRICS_POSTGRES_DB:?BIZMETRICS_POSTGRES_DB is required}
      BIZMETRICS_DATASOURCE_USERNAME: ${BIZMETRICS_POSTGRES_USER:?BIZMETRICS_POSTGRES_USER is required}
      BIZMETRICS_DATASOURCE_PASSWORD: ${BIZMETRICS_POSTGRES_PASSWORD:?BIZMETRICS_POSTGRES_PASSWORD is required}
      BIZMETRICS_PRODUCT_MODE: ${BIZMETRICS_PRODUCT_MODE:-internal-module}
      BIZMETRICS_MODULE_HOUSEHOLD_ENABLED: ${BIZMETRICS_MODULE_HOUSEHOLD_ENABLED:-false}
      BIZMETRICS_MODULE_PEOPLE_CORE_ENABLED: ${BIZMETRICS_MODULE_PEOPLE_CORE_ENABLED:-false}
      BIZMETRICS_MODULE_WORKFORCE_COST_ENABLED: ${BIZMETRICS_MODULE_WORKFORCE_COST_ENABLED:-false}
      BIZMETRICS_MODULE_TALENT_SUITE_ENABLED: ${BIZMETRICS_MODULE_TALENT_SUITE_ENABLED:-false}
      BIZMETRICS_MODULE_TAX_WORKSPACE_ENABLED: ${BIZMETRICS_MODULE_TAX_WORKSPACE_ENABLED:-false}
      BIZMETRICS_MODULE_POLICY_CENTER_ENABLED: ${BIZMETRICS_MODULE_POLICY_CENTER_ENABLED:-false}
      BIZMETRICS_MODULE_BACKUP_UI_ENABLED: ${BIZMETRICS_MODULE_BACKUP_UI_ENABLED:-false}
      BIZMETRICS_RUNTIME_ENVIRONMENT: ${BIZMETRICS_RUNTIME_ENVIRONMENT:-production}
      BIZMETRICS_DB_POOL_MAX_SIZE: ${BIZMETRICS_DB_POOL_MAX_SIZE:-20}
      BIZMETRICS_DB_POOL_MIN_IDLE: ${BIZMETRICS_DB_POOL_MIN_IDLE:-4}
      BIZMETRICS_DB_POOL_CONNECTION_TIMEOUT_MS: ${BIZMETRICS_DB_POOL_CONNECTION_TIMEOUT_MS:-5000}
      BIZMETRICS_DB_POOL_VALIDATION_TIMEOUT_MS: ${BIZMETRICS_DB_POOL_VALIDATION_TIMEOUT_MS:-2000}
      BIZMETRICS_DB_POOL_IDLE_TIMEOUT_MS: ${BIZMETRICS_DB_POOL_IDLE_TIMEOUT_MS:-600000}
      BIZMETRICS_DB_POOL_MAX_LIFETIME_MS: ${BIZMETRICS_DB_POOL_MAX_LIFETIME_MS:-1800000}
      BIZMETRICS_DB_POOL_KEEPALIVE_MS: ${BIZMETRICS_DB_POOL_KEEPALIVE_MS:-120000}
      BIZMETRICS_DB_POOL_LEAK_DETECTION_MS: ${BIZMETRICS_DB_POOL_LEAK_DETECTION_MS:-0}
      BIZMETRICS_DB_CONNECT_TIMEOUT_SECONDS: ${BIZMETRICS_DB_CONNECT_TIMEOUT_SECONDS:-5}
      BIZMETRICS_DB_SOCKET_TIMEOUT_SECONDS: ${BIZMETRICS_DB_SOCKET_TIMEOUT_SECONDS:-30}
      BIZMETRICS_HTTP_CONNECTION_TIMEOUT: ${BIZMETRICS_HTTP_CONNECTION_TIMEOUT:-5s}
      BIZMETRICS_HTTP_KEEP_ALIVE_TIMEOUT: ${BIZMETRICS_HTTP_KEEP_ALIVE_TIMEOUT:-20s}
      BIZMETRICS_HTTP_MAX_KEEP_ALIVE_REQUESTS: ${BIZMETRICS_HTTP_MAX_KEEP_ALIVE_REQUESTS:-100}
      BIZMETRICS_HTTP_MAX_CONNECTIONS: ${BIZMETRICS_HTTP_MAX_CONNECTIONS:-4096}
      BIZMETRICS_HTTP_ACCEPT_COUNT: ${BIZMETRICS_HTTP_ACCEPT_COUNT:-100}
      BIZMETRICS_HTTP_MAX_THREADS: ${BIZMETRICS_HTTP_MAX_THREADS:-100}
      BIZMETRICS_HTTP_MIN_SPARE_THREADS: ${BIZMETRICS_HTTP_MIN_SPARE_THREADS:-10}
      BIZMETRICS_SHUTDOWN_TIMEOUT: ${BIZMETRICS_SHUTDOWN_TIMEOUT:-30s}
      BIZMETRICS_BOOTSTRAP_MODE: ${BIZMETRICS_BOOTSTRAP_MODE:-bootstrap}
      BIZMETRICS_BOOTSTRAP_ADMIN_EMAIL: ${BIZMETRICS_BOOTSTRAP_ADMIN_EMAIL:?BIZMETRICS_BOOTSTRAP_ADMIN_EMAIL is required}
      BIZMETRICS_BOOTSTRAP_ADMIN_PASSWORD: ${BIZMETRICS_BOOTSTRAP_ADMIN_PASSWORD:?BIZMETRICS_BOOTSTRAP_ADMIN_PASSWORD is required}
      BIZMETRICS_BOOTSTRAP_ADMIN_NICKNAME: ${BIZMETRICS_BOOTSTRAP_ADMIN_NICKNAME:-系统管理员}
      BIZMETRICS_BOOTSTRAP_COMPANY_NAME: ${BIZMETRICS_BOOTSTRAP_COMPANY_NAME:?BIZMETRICS_BOOTSTRAP_COMPANY_NAME is required}
      BIZMETRICS_BOOTSTRAP_COMPANY_CREDIT_CODE: ${BIZMETRICS_BOOTSTRAP_COMPANY_CREDIT_CODE:-}
      BIZMETRICS_BOOTSTRAP_COMPANY_INDUSTRY: ${BIZMETRICS_BOOTSTRAP_COMPANY_INDUSTRY:-未设置}
      BIZMETRICS_BOOTSTRAP_COMPANY_TAXPAYER_TYPE: ${BIZMETRICS_BOOTSTRAP_COMPANY_TAXPAYER_TYPE:-未设置}
      BIZMETRICS_BOOTSTRAP_COMPANY_CURRENCY: ${BIZMETRICS_BOOTSTRAP_COMPANY_CURRENCY:-CNY}
      BIZMETRICS_FLYWAY_ENABLED: ${BIZMETRICS_FLYWAY_ENABLED:-true}
      BIZMETRICS_REGISTRATION_MODE: ${BIZMETRICS_REGISTRATION_MODE:-invite}
      BIZMETRICS_ALLOWED_ORIGINS: ${BIZMETRICS_ALLOWED_ORIGINS:?BIZMETRICS_ALLOWED_ORIGINS is required}
      BIZMETRICS_AUTH_MAX_FAILED_ATTEMPTS: ${BIZMETRICS_AUTH_MAX_FAILED_ATTEMPTS:-5}
      BIZMETRICS_AUTH_MAX_FAILED_ATTEMPTS_PER_SOURCE: ${BIZMETRICS_AUTH_MAX_FAILED_ATTEMPTS_PER_SOURCE:-50}
      BIZMETRICS_AUTH_FAILURE_WINDOW_MINUTES: ${BIZMETRICS_AUTH_FAILURE_WINDOW_MINUTES:-15}
      BIZMETRICS_AUTH_LOCK_MINUTES: ${BIZMETRICS_AUTH_LOCK_MINUTES:-15}
      BIZMETRICS_AUTH_TRUST_FORWARDED_HEADERS: ${BIZMETRICS_AUTH_TRUST_FORWARDED_HEADERS:-true}
      BIZMETRICS_PASSWORD_MIN_LENGTH: ${BIZMETRICS_PASSWORD_MIN_LENGTH:-12}
      BIZMETRICS_PASSWORD_REQUIRE_COMPLEXITY: ${BIZMETRICS_PASSWORD_REQUIRE_COMPLEXITY:-true}
      BIZMETRICS_OUTBOX_ENABLED: ${BIZMETRICS_OUTBOX_ENABLED:-true}
      BIZMETRICS_OUTBOX_CONSUMER_ENABLED: ${BIZMETRICS_OUTBOX_CONSUMER_ENABLED:-true}
      BIZMETRICS_OUTBOX_CONSUMER_FIXED_DELAY_MS: ${BIZMETRICS_OUTBOX_CONSUMER_FIXED_DELAY_MS:-5000}
      BIZMETRICS_OUTBOX_CONSUMER_BATCH_SIZE: ${BIZMETRICS_OUTBOX_CONSUMER_BATCH_SIZE:-20}
      BIZMETRICS_OUTBOX_CONSUMER_MAX_ATTEMPTS: ${BIZMETRICS_OUTBOX_CONSUMER_MAX_ATTEMPTS:-8}
      BIZMETRICS_OUTBOX_CONSUMER_STALE_LOCK_MINUTES: ${BIZMETRICS_OUTBOX_CONSUMER_STALE_LOCK_MINUTES:-10}
      BIZMETRICS_NOTIFICATIONS_ENABLED: ${BIZMETRICS_NOTIFICATIONS_ENABLED:-true}
      BIZMETRICS_NOTIFICATION_REMINDERS_ENABLED: ${BIZMETRICS_NOTIFICATION_REMINDERS_ENABLED:-true}
      BIZMETRICS_NOTIFICATION_REMINDER_FIXED_DELAY_MS: ${BIZMETRICS_NOTIFICATION_REMINDER_FIXED_DELAY_MS:-60000}
      BIZMETRICS_NOTIFICATION_REMINDER_LEASE_MS: ${BIZMETRICS_NOTIFICATION_REMINDER_LEASE_MS:-600000}
      BIZMETRICS_NOTIFICATION_TAX_LOOKAHEAD_DAYS: ${BIZMETRICS_NOTIFICATION_TAX_LOOKAHEAD_DAYS:-7}
      BIZMETRICS_NOTIFICATION_PEOPLE_LOOKAHEAD_DAYS: ${BIZMETRICS_NOTIFICATION_PEOPLE_LOOKAHEAD_DAYS:-14}
      BIZMETRICS_NOTIFICATION_RECEIPT_LOOKAHEAD_DAYS: ${BIZMETRICS_NOTIFICATION_RECEIPT_LOOKAHEAD_DAYS:-7}
      BIZMETRICS_NOTIFICATION_DELIVERY_ENABLED: ${BIZMETRICS_NOTIFICATION_DELIVERY_ENABLED:-true}
      BIZMETRICS_NOTIFICATION_DELIVERY_FIXED_DELAY_MS: ${BIZMETRICS_NOTIFICATION_DELIVERY_FIXED_DELAY_MS:-10000}
      BIZMETRICS_NOTIFICATION_DELIVERY_BATCH_SIZE: ${BIZMETRICS_NOTIFICATION_DELIVERY_BATCH_SIZE:-20}
      BIZMETRICS_NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${BIZMETRICS_NOTIFICATION_DELIVERY_MAX_ATTEMPTS:-6}
      BIZMETRICS_NOTIFICATION_DELIVERY_STALE_LOCK_MINUTES: ${BIZMETRICS_NOTIFICATION_DELIVERY_STALE_LOCK_MINUTES:-10}
      BIZMETRICS_NOTIFICATION_DELIVERY_TIMEOUT_SECONDS: ${BIZMETRICS_NOTIFICATION_DELIVERY_TIMEOUT_SECONDS:-5}
      BIZMETRICS_OBJECT_STORAGE_ENABLED: "true"
      BIZMETRICS_MINIO_ENDPOINT: http://minio:9000
      BIZMETRICS_MINIO_ACCESS_KEY: ${BIZMETRICS_MINIO_ACCESS_KEY:?BIZMETRICS_MINIO_ACCESS_KEY is required}
      BIZMETRICS_MINIO_SECRET_KEY: ${BIZMETRICS_MINIO_SECRET_KEY:?BIZMETRICS_MINIO_SECRET_KEY is required}
      BIZMETRICS_MINIO_BUCKET: ${BIZMETRICS_MINIO_BUCKET:-bizmetrics}
      BIZMETRICS_MINIO_REGION: ${BIZMETRICS_MINIO_REGION:-us-east-1}
      BIZMETRICS_MINIO_EXTERNAL_URL: ${BIZMETRICS_MINIO_EXTERNAL_URL:?BIZMETRICS_MINIO_EXTERNAL_URL is required}
      BIZMETRICS_MINIO_PRESIGNED_URL_EXPIRY_SECONDS: ${BIZMETRICS_MINIO_PRESIGNED_URL_EXPIRY_SECONDS:-600}
      BIZMETRICS_RECEIPT_STORAGE_MAX_BYTES_PER_COMPANY: ${BIZMETRICS_RECEIPT_STORAGE_MAX_BYTES_PER_COMPANY:-10737418240}
      BIZMETRICS_RECEIPT_STORAGE_WARNING_PERCENT: ${BIZMETRICS_RECEIPT_STORAGE_WARNING_PERCENT:-80}
      BIZMETRICS_RECEIPT_STORAGE_AUDIT_ENABLED: ${BIZMETRICS_RECEIPT_STORAGE_AUDIT_ENABLED:-true}
      BIZMETRICS_RECEIPT_STORAGE_AUDIT_POLL_DELAY_MS: ${BIZMETRICS_RECEIPT_STORAGE_AUDIT_POLL_DELAY_MS:-60000}
      BIZMETRICS_RECEIPT_STORAGE_AUDIT_CADENCE_MS: ${BIZMETRICS_RECEIPT_STORAGE_AUDIT_CADENCE_MS:-21600000}
      BIZMETRICS_RECEIPT_STORAGE_AUDIT_LEASE_MS: ${BIZMETRICS_RECEIPT_STORAGE_AUDIT_LEASE_MS:-1800000}
      BIZMETRICS_RECEIPT_STORAGE_AUDIT_MAX_OBJECTS: ${BIZMETRICS_RECEIPT_STORAGE_AUDIT_MAX_OBJECTS:-100000}
      BIZMETRICS_RECEIPT_STORAGE_AUDIT_ORPHAN_GRACE_MS: ${BIZMETRICS_RECEIPT_STORAGE_AUDIT_ORPHAN_GRACE_MS:-3600000}
      BIZMETRICS_RECEIPT_STORAGE_AUDIT_SAMPLE_SIZE: ${BIZMETRICS_RECEIPT_STORAGE_AUDIT_SAMPLE_SIZE:-10}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:38080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: bizmetrics-frontend:prod
    restart: unless-stopped
    init: true
    stop_grace_period: ${BIZMETRICS_FRONTEND_STOP_GRACE_PERIOD:-30s}
    cpus: "${BIZMETRICS_FRONTEND_CPUS:-1.0}"
    mem_limit: ${BIZMETRICS_FRONTEND_MEMORY_LIMIT:-768m}
    pids_limit: ${BIZMETRICS_FRONTEND_PIDS_LIMIT:-256}
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: ${BIZMETRICS_POSTGRES_STOP_GRACE_PERIOD:-60s}
    cpus: "${BIZMETRICS_POSTGRES_CPUS:-2.0}"
    mem_limit: ${BIZMETRICS_POSTGRES_MEMORY_LIMIT:-2g}
    pids_limit: ${BIZMETRICS_POSTGRES_PIDS_LIMIT:-256}
    shm_size: ${BIZMETRICS_POSTGRES_SHM_SIZE:-256m}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${BIZMETRICS_POSTGRES_DB:?BIZMETRICS_POSTGRES_DB is required}
      POSTGRES_USER: ${BIZMETRICS_POSTGRES_USER:?BIZMETRICS_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${BIZMETRICS_POSTGRES_PASSWORD:?BIZMETRICS_POSTGRES_PASSWORD is required}
    volumes:
      - bizmetrics-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12

  minio:
    image: quay.io/minio/minio:${BIZMETRICS_MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    init: true
    stop_grace_period: ${BIZMETRICS_MINIO_STOP_GRACE_PERIOD:-30s}
    cpus: "${BIZMETRICS_MINIO_CPUS:-1.0}"
    mem_limit: ${BIZMETRICS_MINIO_MEMORY_LIMIT:-1g}
    pids_limit: ${BIZMETRICS_MINIO_PIDS_LIMIT:-256}
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BIZMETRICS_MINIO_ACCESS_KEY:?BIZMETRICS_MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${BIZMETRICS_MINIO_SECRET_KEY:?BIZMETRICS_MINIO_SECRET_KEY is required}
    volumes:
      - bizmetrics-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12

  prometheus:
    image: prom/prometheus:${BIZMETRICS_PROMETHEUS_VERSION:-v3.12.0}
    restart: unless-stopped
    init: true
    stop_grace_period: ${BIZMETRICS_PROMETHEUS_STOP_GRACE_PERIOD:-30s}
    cpus: "${BIZMETRICS_PROMETHEUS_CPUS:-1.0}"
    mem_limit: ${BIZMETRICS_PROMETHEUS_MEMORY_LIMIT:-1g}
    pids_limit: ${BIZMETRICS_PROMETHEUS_PIDS_LIMIT:-256}
    logging: *default-logging
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${BIZMETRICS_PROMETHEUS_PORT:-127.0.0.1:39090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - bizmetrics-prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bizmetrics-caddy-data:
  bizmetrics-caddy-config:
  bizmetrics-postgres-data:
  bizmetrics-minio-data:
  bizmetrics-prometheus-data:
