name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Backend verify
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Frontend install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend production dependency audit
        working-directory: frontend
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend build
        working-directory: frontend
        run: pnpm build

      - name: Shell syntax
        run: bash -n scripts/*.sh scripts/tests/*.sh scripts/tests/fixtures/backup-bin/* scripts/tests/fixtures/replica-smoke-bin/*

      - name: Shell tests
        run: |
          scripts/tests/backup-maintenance-test.sh
          scripts/tests/replica-smoke-test.sh

      - name: Compose config
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config >/tmp/bizmetrics-compose.yml

      - name: Caddy config
        run: >-
          docker run --rm
          -e BIZMETRICS_PUBLIC_HOST=bizmetrics.example.com
          -e BIZMETRICS_TLS_EMAIL=ops@example.com
          -e BIZMETRICS_MINIO_BUCKET=bizmetrics
          -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile
