name: bizmetrics

services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bizmetrics-backend:local
    init: true
    stop_grace_period: 45s
    environment:
      BIZMETRICS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${BIZMETRICS_POSTGRES_DB:-bizmetrics}
      BIZMETRICS_DATASOURCE_USERNAME: ${BIZMETRICS_POSTGRES_USER:-bizmetrics}
      BIZMETRICS_DATASOURCE_PASSWORD: ${BIZMETRICS_POSTGRES_PASSWORD:-bizmetrics}
      BIZMETRICS_PRODUCT_MODE: ${BIZMETRICS_PRODUCT_MODE:-internal-module}
      BIZMETRICS_MODULE_HOUSEHOLD_ENABLED: ${BIZMETRICS_MODULE_HOUSEHOLD_ENABLED:-false}
      BIZMETRICS_MODULE_PEOPLE_CORE_ENABLED: ${BIZMETRICS_MODULE_PEOPLE_CORE_ENABLED:-false}
      BIZMETRICS_MODULE_WORKFORCE_COST_ENABLED: ${BIZMETRICS_MODULE_WORKFORCE_COST_ENABLED:-false}
      BIZMETRICS_MODULE_TALENT_SUITE_ENABLED: ${BIZMETRICS_MODULE_TALENT_SUITE_ENABLED:-false}
      BIZMETRICS_MODULE_TAX_WORKSPACE_ENABLED: ${BIZMETRICS_MODULE_TAX_WORKSPACE_ENABLED:-false}
      BIZMETRICS_MODULE_POLICY_CENTER_ENABLED: ${BIZMETRICS_MODULE_POLICY_CENTER_ENABLED:-false}
      BIZMETRICS_MODULE_BACKUP_UI_ENABLED: ${BIZMETRICS_MODULE_BACKUP_UI_ENABLED:-false}
      BIZMETRICS_OBJECT_STORAGE_ENABLED: "true"
      BIZMETRICS_MINIO_ENDPOINT: http://minio:9000
      BIZMETRICS_MINIO_ACCESS_KEY: ${BIZMETRICS_MINIO_ACCESS_KEY:-minioadmin}
      BIZMETRICS_MINIO_SECRET_KEY: ${BIZMETRICS_MINIO_SECRET_KEY:-minioadmin}
      BIZMETRICS_MINIO_BUCKET: ${BIZMETRICS_MINIO_BUCKET:-bizmetrics}
      BIZMETRICS_MINIO_REGION: ${BIZMETRICS_MINIO_REGION:-us-east-1}
      BIZMETRICS_MINIO_EXTERNAL_URL: ${BIZMETRICS_MINIO_EXTERNAL_URL:-http://localhost:39080}
      BIZMETRICS_MINIO_PRESIGNED_URL_EXPIRY_SECONDS: ${BIZMETRICS_MINIO_PRESIGNED_URL_EXPIRY_SECONDS:-600}
    ports:
      - "${BIZMETRICS_BACKEND_PORT:-38080}:38080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:38080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12

  minio:
    restart: unless-stopped
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    command: server /data --console-address ":9001"
    init: true
    stop_grace_period: 30s
    environment:
      MINIO_ROOT_USER: ${BIZMETRICS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BIZMETRICS_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${BIZMETRICS_MINIO_API_PORT:-39080}:9000"
      - "${BIZMETRICS_MINIO_CONSOLE_PORT:-39081}:9001"
    volumes:
      - bizmetrics-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12

  postgres:
    restart: unless-stopped
    image: postgres:18.4-alpine
    init: true
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${BIZMETRICS_POSTGRES_DB:-bizmetrics}
      POSTGRES_USER: ${BIZMETRICS_POSTGRES_USER:-bizmetrics}
      POSTGRES_PASSWORD: ${BIZMETRICS_POSTGRES_PASSWORD:-bizmetrics}
    volumes:
      - bizmetrics-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: bizmetrics-frontend:local
    init: true
    stop_grace_period: 30s
    ports:
      - "${BIZMETRICS_FRONTEND_PORT:-33000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12

volumes:
  bizmetrics-minio-data:
  bizmetrics-postgres-data:
